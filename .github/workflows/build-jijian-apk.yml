name: Build 秒薪计件 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'jijian_app/**'
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jijian_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jijian-release-apk
          path: jijian_app/build/app/outputs/flutter-apk/app-release.apk
